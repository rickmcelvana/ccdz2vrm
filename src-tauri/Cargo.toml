[package]
name = "ccdz2vrm"
version = "0.1.0"
description = "Daz 3D / Character Creator FBX to VRM 1.0, driving the user's own Blender"
edition = "2024"

[lib]
name = "ccdz2vrm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
# Versions as latentPresence's shell (read from crates.io 2026-10-16), opener 2.7.2 read 2026-10-22.
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-opener = "2.7.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
memchr = "2.8.3"
